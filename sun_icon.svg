<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF3C7" />
      <stop offset="100%" style="stop-color:#FBBF24" />
    </linearGradient>
  </defs>
  
  <!-- Sun rays - 16 point star with rounded tips -->
  <polygon 
    fill="url(#sunGradient)" 
    stroke="url(#sunGradient)" 
    stroke-width="8" 
    stroke-linejoin="round"
    points="
      100,5
      110.7,46
      136.4,12.2
      130.6,54.3
      167.2,32.8
      145.7,69.4
      187.8,63.6
      153.9,89.3
      195,100
      153.9,110.7
      187.8,136.4
      145.7,130.6
      167.2,167.2
      130.6,145.7
      136.4,187.8
      110.7,153.9
      100,195
      89.3,153.9
      63.6,187.8
      69.4,145.7
      32.8,167.2
      54.3,130.6
      12.2,136.4
      46,110.7
      5,100
      46,89.3
      12.2,63.6
      54.3,69.4
      32.8,32.8
      69.4,54.3
      63.6,12.2
      89.3,46
    "/>
  
  <!-- Main sun circle -->
  <circle cx="100" cy="100" r="55" fill="url(#sunGradient)" />
  
  <!-- White ring - outer edge at radius 61 (where rays begin) -->
  <circle cx="100" cy="100" r="58" fill="none" stroke="white" stroke-width="6" />
  
  <!-- Question mark -->
  <text x="100" y="118" 
        font-family="Arial, sans-serif" 
        font-size="55" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle">?</text>
</svg>
