<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunshine Optimist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky-top: #b9d7f6;
      --sky-mid: #f3c8d0;
      --sky-lower: #f8caa9;
      --sky-bottom: #ffda9c;
      --card: #fff9ef;
      --text: #3b332b;
      --muted: #6b5f55;
      --accent: #c86f15;
      --accent-strong: #a95800;
      --divider: #ede1d1;
      --glass-bg: rgba(255, 255, 255, 0.32);
      --glass-border: rgba(255, 255, 255, 0.45);
      --sans: "DM Sans", "SF Pro Display", "Helvetica Neue", "Segoe UI", system-ui, -apple-system, sans-serif;
      --serif: "DM Sans", "SF Pro Display", "Helvetica Neue", "Segoe UI", system-ui, -apple-system, sans-serif;
      --shadow: 0 20px 48px rgba(82, 48, 18, 0.14);
      color: var(--text);
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 32%, var(--sky-lower) 58%, var(--sky-bottom) 100%);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 18px 52px;
      font-family: var(--sans);
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 32%, var(--sky-lower) 58%, var(--sky-bottom) 100%);
    }

    .shell {
      width: min(900px, 100%);
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .location {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #2f2a26;
      font-size: 18px;
      padding: 10px 14px;
      border-radius: 16px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .location svg {
      width: 22px;
      height: 22px;
      color: #2f2a26;
    }

    .card {
      background: var(--card);
      border-radius: 30px;
      padding: 46px 52px 40px;
      width: min(760px, 100%);
      box-shadow: var(--shadow);
      text-align: center;
    }

    h1 {
      margin: 0 0 14px;
      font-family: var(--serif);
      font-size: clamp(34px, 4vw + 6px, 46px);
      line-height: 1.12;
      color: #c46e13;
      font-weight: 700;
    }

    .lede {
      margin: 0 0 16px;
      font-size: clamp(22px, 3vw, 26px);
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #36302a;
    }

    .secondary {
      margin: 0 0 30px;
      font-size: 16px;
      color: var(--muted);
    }

    .milestone {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 18px;
      align-items: center;
      padding: 18px 20px;
      border-radius: 22px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      margin: 0 0 28px;
      text-align: left;
    }

    .milestone-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #ffe8c7;
      color: #d8861c;
      display: grid;
      place-items: center;
    }

    .milestone-icon svg {
      width: 28px;
      height: 28px;
    }

    .milestone-copy {
      text-align: left;
    }

    .milestone-eyebrow {
      margin: 0 0 4px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      font-size: 12px;
      color: #7a6c60;
    }

    .milestone-headline {
      margin: 0 0 6px;
      font-weight: 800;
      font-size: 22px;
      color: #362c24;
    }

    .milestone-date {
      margin: 0;
      display: flex;
      gap: 8px;
      align-items: baseline;
      color: #6b5f55;
      font-weight: 600;
    }

    .milestone-away {
      color: #d8861c;
      font-weight: 700;
    }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
      padding-top: 22px;
      border-top: 1px solid var(--divider);
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 0 12px 4px;
      text-align: center;
    }

    .stat-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .stat-icon {
      color: #c46e13;
      display: grid;
      place-items: center;
    }

    .stat-icon svg {
      width: 36px;
      height: 36px;
    }

    .stat .label {
      letter-spacing: 0.01em;
      font-weight: 700;
      font-size: 13px;
      color: var(--muted);
    }

    .stat .value {
      font-size: 32px;
      font-weight: 800;
      color: #2d261f;
    }

    .stat-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 100%;
    }

    .stat-deltas {
      width: 100%;
      display: grid;
      gap: 10px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .delta-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .delta-label {
      font-size: 12px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    .delta-value {
      font-size: 16px;
      font-weight: 800;
      color: #d8861c;
    }

    .cta {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 18px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, #e69522, #cd7512);
      color: #fff;
      border: none;
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: 0 15px 25px rgba(191, 109, 14, 0.28);
      cursor: pointer;
      font-size: 16px;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 30px rgba(191, 109, 14, 0.32);
    }

    .cta:active {
      transform: translateY(1px);
    }

    .cta svg {
      width: 16px;
      height: 16px;
    }

    @media (max-width: 640px) {
      body {
        padding: 24px 14px 40px;
      }

      .card {
        padding: 32px 28px 30px;
        border-radius: 22px;
      }

      .stat-row {
        grid-template-columns: 1fr;
      }

      .stat {
        padding-right: 0;
      }

    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="location" aria-label="Location">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 21s-6-5.33-6-10a6 6 0 0 1 12 0c0 4.67-6 10-6 10z"></path>
        <circle cx="12" cy="11" r="2.5"></circle>
      </svg>
      <span id="city">San Francisco</span>
    </div>

    <section class="card" aria-live="polite">
      <h1 id="headline">Today is already brighter.</h1>
      <p class="lede" id="lede">+2 minutes of daylight today</p>
      <div class="milestone" aria-label="Upcoming milestone">
        <div class="milestone-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="5" width="16" height="15" rx="2" />
            <path d="M16 3v4" />
            <path d="M8 3v4" />
            <path d="M4 11h16" />
            <path d="M9 15h6" />
          </svg>
        </div>
        <div class="milestone-copy">
          <p class="milestone-eyebrow">Coming up</p>
          <p class="milestone-headline" id="next-headline">Next 5:30 PM Sunset</p>
          <p class="milestone-date">
            <span class="milestone-date-text" id="next-date">February 16, 2025</span>
            <span class="milestone-away" id="next-away">(12 days away)</span>
          </p>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat">
          <div class="stat-header">
            <div class="stat-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 10V2"></path>
                <path d="m4.93 10.93 1.41 1.41"></path>
                <path d="M2 18h2"></path>
                <path d="M20 18h2"></path>
                <path d="m19.07 10.93-1.41 1.41"></path>
                <path d="M22 22H2"></path>
                <path d="m16 6-4 4-4-4"></path>
                <path d="M16 18a4 4 0 0 0-8 0"></path>
              </svg>
            </div>
            <span class="label">Sunset</span>
          </div>
          <div class="stat-main">
            <span class="value" id="sunset-time">5:14 PM</span>
            <div class="stat-deltas" aria-label="Sunset change history">
              <div class="delta-row">
                <span class="delta-label">vs. 1 week ago</span>
                <span class="delta-value" id="sunset-week-delta">+8 min</span>
              </div>
              <div class="delta-row">
                <span class="delta-label">vs. 1 month ago</span>
                <span class="delta-value" id="sunset-month-delta">+38 min</span>
              </div>
            </div>
          </div>
        </div>
        <div class="stat">
          <div class="stat-header">
            <div class="stat-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2"></path>
                <path d="M12 20v2"></path>
                <path d="m4.93 4.93 1.41 1.41"></path>
                <path d="m17.66 17.66 1.41 1.41"></path>
                <path d="M2 12h2"></path>
                <path d="M20 12h2"></path>
                <path d="m4.93 19.07 1.41-1.41"></path>
                <path d="m17.66 6.34 1.41-1.41"></path>
              </svg>
            </div>
            <span class="label">Daylight</span>
          </div>
          <div class="stat-main">
            <span class="value" id="daylight-duration">9h 42m</span>
            <div class="stat-deltas" aria-label="Daylight change history">
              <div class="delta-row">
                <span class="delta-label">vs. 1 week ago</span>
                <span class="delta-value" id="daylight-week-delta">+15 min</span>
              </div>
              <div class="delta-row">
                <span class="delta-label">vs. 1 month ago</span>
                <span class="delta-value" id="daylight-month-delta">+1h 12m</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <button class="cta" type="button" id="share">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12v7a1 1 0 0 0 1 1h4"></path>
        <path d="M20 12v7a1 1 0 0 1-1 1h-4"></path>
        <path d="M16 8L12 4 8 8"></path>
        <path d="M12 4v13"></path>
      </svg>
      <span>Share Your Sunlight</span>
    </button>

  </div>

  <script>
    const shareButton = document.getElementById("share");
    const headline = document.getElementById("headline");
    const lede = document.getElementById("lede");

    shareButton.addEventListener("click", () => {
      const message = `${headline.textContent} ${lede.textContent} — via Sunshine Optimist`;
      navigator.clipboard?.writeText(message).then(() => {
        const label = shareButton.querySelector("span");
        const previous = label.textContent;
        label.textContent = "Copied!";
        setTimeout(() => (label.textContent = previous), 1200);
      });
    });
  </script>
</body>
</html>
