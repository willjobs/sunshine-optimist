<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunshine Optimist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Manrope:wght@400..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky-top: #b9d7f6;
      --sky-mid: #f3c8d0;
      --sky-lower: #f8caa9;
      --sky-bottom: #ffda9c;
      --card: #fff9ef;
      --text: #3b332b;
      --muted: #6b5f55;
      --accent: #c86f15;
      --accent-strong: #a95800;
      --divider: #ede1d1;
      --glass-bg: rgba(255, 255, 255, 0.32);
      --glass-border: rgba(255, 255, 255, 0.45);
      --sans: "Manrope", "Avenir Next", "SF Pro Text", "Helvetica Neue", sans-serif;
      --serif: "Fraunces", "Iowan Old Style", "Palatino", "Times New Roman", serif;
      --shadow: 0 20px 48px rgba(82, 48, 18, 0.14);
      color: var(--text);
      background: linear-gradient(180deg, #D7ECFF 0%, #FFFBF0 50%, #FFF0C2 100%);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 18px 52px;
      font-family: var(--sans);
      background: linear-gradient(180deg, #D7ECFF 0%, #FFFBF0 50%, #FFF0C2 100%);
    }

    .shell {
      width: min(900px, 100%);
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .location {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #2f2a26;
      font-size: 16px;
      padding: 10px 14px;
      position: relative;
      z-index: 20;
      border-radius: 16px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .location-geolocate {
      border: 1px solid rgba(200, 111, 21, 0.28);
      background: rgba(255, 255, 255, 0.75);
      color: #a35b06;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(164, 88, 0, 0.16);
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease,
        color 120ms ease, border-color 120ms ease;
    }

    .location-geolocate:hover {
      background: #fff4df;
      color: #a95800;
      border-color: rgba(200, 111, 21, 0.45);
      transform: translateY(-1px);
      box-shadow: 0 10px 16px rgba(164, 88, 0, 0.2);
    }

    .location-geolocate:active {
      transform: translateY(0);
      box-shadow: 0 5px 10px rgba(164, 88, 0, 0.16);
    }

    .location-geolocate:focus-visible {
      outline: 2px solid #d9b079;
      outline-offset: 2px;
    }

    .location-geolocate:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .location-geolocate svg {
      width: 20px;
      height: 20px;
    }

    .location-input {
      position: relative;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #city-input {
      border: none;
      background: transparent;
      font-family: var(--sans);
      font-size: 16px;
      font-weight: 600;
      color: #2f2a26;
      width: clamp(160px, 28vw, 240px);
      padding: 2px 4px;
    }

    #city-input::placeholder {
      color: #7a6c60;
      font-weight: 500;
    }

    #city-input:focus {
      outline: none;
    }

    .location-clear {
      border: none;
      background: transparent;
      color: #7a6c60;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms ease;
    }

    .location-clear.is-visible {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    .location-clear:focus-visible {
      outline: 2px solid #d9b079;
      border-radius: 8px;
    }

    .location-results {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: var(--card);
      border: 1px solid var(--divider);
      border-radius: 16px;
      box-shadow: 0 18px 30px rgba(82, 48, 18, 0.14);
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 6px;
      z-index: 5;
    }

    .location-results.is-open {
      display: flex;
    }

    .location-results-meta:empty {
      display: none;
    }

    .location-results-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .location-results-actions:empty {
      display: none;
    }

    .location-results-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      padding: 4px 0 6px;
    }

    .location-status {
      padding: 4px 10px 2px;
      font-size: 12px;
      color: var(--muted);
    }

    .location-status.is-error {
      color: #a13b2b;
      font-weight: 600;
    }

    .location-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .location-group-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      color: #a8723e;
      padding: 4px 12px 0;
    }

    .location-option {
      width: 100%;
      border: none;
      background: transparent;
      text-align: left;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #2f2a26;
      cursor: pointer;
    }

    .location-option:hover,
    .location-option.is-active {
      background: #ffe8c7;
    }

    .location-empty {
      padding: 8px 12px;
      font-size: 13px;
      color: var(--muted);
    }

    .location-action {
      margin: 0;
      border: none;
      border-radius: 12px;
      padding: 8px 12px;
      background: #ffe8c7;
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
    }

    .location-action:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .location-action.is-secondary {
      background: #fff1dc;
      color: #a8723e;
    }

    .location-hint {
      padding: 2px 12px 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
      white-space: nowrap;
    }

    .card {
      background: var(--card);
      border-radius: 30px;
      padding: 46px 52px 40px;
      width: min(760px, 100%);
      box-shadow: var(--shadow);
      text-align: center;
    }

    h1 {
      margin: 0 0 14px;
      font-family: var(--serif);
      font-size: clamp(34px, 4vw + 6px, 46px);
      line-height: 1.12;
      color: #c46e13;
      font-weight: 600;
    }

    .lede {
      margin: 0 0 16px;
      font-size: clamp(22px, 3vw, 26px);
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #36302a;
    }

    .secondary {
      margin: 0 0 30px;
      font-size: 16px;
      color: var(--muted);
    }

    .milestone {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 18px;
      align-items: center;
      padding: 18px 20px;
      border-radius: 22px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      margin: 0 0 28px;
      text-align: left;
    }

    .milestone-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #ffe8c7;
      color: #d8861c;
      display: grid;
      place-items: center;
    }

    .milestone-icon svg {
      width: 28px;
      height: 28px;
    }

    .milestone-copy {
      text-align: left;
    }

    .milestone-eyebrow {
      margin: 0 0 4px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      font-size: 12px;
      color: #7a6c60;
    }

    .milestone-headline {
      margin: 0 0 6px;
      font-weight: 700;
      font-size: 22px;
      color: #362c24;
    }

    .milestone-date {
      margin: 0;
      display: flex;
      gap: 8px;
      align-items: baseline;
      color: #6b5f55;
      font-weight: 600;
    }

    .milestone-away {
      color: #d8861c;
      font-weight: 600;
    }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
      padding-top: 22px;
      border-top: 1px solid var(--divider);
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 0 12px 4px;
      text-align: center;
    }

    .stat-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .stat-icon {
      color: #c46e13;
      display: grid;
      place-items: center;
    }

    .stat-icon svg {
      width: 36px;
      height: 36px;
    }

    .stat .label {
      letter-spacing: 0.01em;
      font-weight: 600;
      font-size: 13px;
      color: var(--muted);
    }

    .stat .value {
      font-size: 32px;
      font-weight: 700;
      color: #2d261f;
    }

    .stat-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 100%;
    }

    .stat-deltas {
      width: 100%;
      display: grid;
      gap: 10px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .delta-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .delta-label {
      font-size: 12px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }

    .delta-value {
      font-size: 16px;
      font-weight: 700;
      color: #d8861c;
    }

    .cta {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 18px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, #e69522, #cd7512);
      color: #fff;
      border: none;
      font-weight: 600;
      letter-spacing: 0.02em;
      box-shadow: 0 15px 25px rgba(191, 109, 14, 0.28);
      cursor: pointer;
      font-size: 16px;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 30px rgba(191, 109, 14, 0.32);
    }

    .cta:active {
      transform: translateY(1px);
    }

    .cta svg {
      width: 16px;
      height: 16px;
    }

    @media (max-width: 640px) {
      body {
        padding: 24px 14px 40px;
      }

      .card {
        padding: 32px 28px 30px;
        border-radius: 22px;
      }

      .stat-row {
        grid-template-columns: 1fr;
      }

      .stat {
        padding-right: 0;
      }

      #city-input {
        width: clamp(140px, 48vw, 220px);
      }

    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="location" aria-label="Location">
      <button
        class="location-geolocate"
        id="location-geolocate"
        type="button"
        aria-label="Use my location"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 21s-6-5.33-6-10a6 6 0 0 1 12 0c0 4.67-6 10-6 10z"></path>
          <circle cx="12" cy="11" r="2.5"></circle>
        </svg>
      </button>
      <div class="location-input">
        <label class="sr-only" for="city-input">City</label>
        <input
          id="city-input"
          type="text"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="location-results-list"
          autocomplete="off"
          placeholder="Enter your city"
          value="Boston, MA"
        />
        <button
          class="location-clear"
          id="location-clear"
          type="button"
          aria-label="Clear location"
        >
          Clear
        </button>
        <div class="location-results" id="location-results" aria-label="City suggestions">
          <div
            class="location-results-meta"
            id="location-results-meta"
            role="status"
            aria-live="polite"
          ></div>
          <div
            class="location-results-list"
            id="location-results-list"
            role="listbox"
            aria-label="City suggestions"
          ></div>
          <div class="location-results-actions" id="location-results-actions"></div>
        </div>
      </div>
    </div>

    <section class="card" aria-live="polite">
      <h1 id="headline">Today is already brighter.</h1>
      <p class="lede" id="lede">+2 minutes of daylight today</p>
      <div class="milestone" aria-label="Upcoming milestone">
        <div class="milestone-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="5" width="16" height="15" rx="2" />
            <path d="M16 3v4" />
            <path d="M8 3v4" />
            <path d="M4 11h16" />
            <path d="M9 15h6" />
          </svg>
        </div>
        <div class="milestone-copy">
          <p class="milestone-eyebrow">Coming up</p>
          <p class="milestone-headline" id="next-headline">Next 5:30 PM Sunset</p>
          <p class="milestone-date">
            <span class="milestone-date-text" id="next-date">February 16, 2025</span>
            <span class="milestone-away" id="next-away">(12 days away)</span>
          </p>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat">
          <div class="stat-header">
            <div class="stat-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 10V2"></path>
                <path d="m4.93 10.93 1.41 1.41"></path>
                <path d="M2 18h2"></path>
                <path d="M20 18h2"></path>
                <path d="m19.07 10.93-1.41 1.41"></path>
                <path d="M22 22H2"></path>
                <path d="m16 6-4 4-4-4"></path>
                <path d="M16 18a4 4 0 0 0-8 0"></path>
              </svg>
            </div>
            <span class="label">Sunset</span>
          </div>
          <div class="stat-main">
            <span class="value" id="sunset-time">5:14 PM</span>
            <div class="stat-deltas" aria-label="Sunset change history">
              <div class="delta-row">
                <span class="delta-label">vs. earliest sunset</span>
                <span class="delta-value" id="sunset-earliest-delta">+42 min</span>
              </div>
              <!--
              <div class="delta-row">
                <span class="delta-label">vs. 1 week ago</span>
                <span class="delta-value" id="sunset-week-delta">+8 min</span>
              </div>
              -->
              <div class="delta-row">
                <span class="delta-label">vs. 1 month ago</span>
                <span class="delta-value" id="sunset-month-delta">+38 min</span>
              </div>
            </div>
          </div>
        </div>
        <div class="stat">
          <div class="stat-header">
            <div class="stat-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2"></path>
                <path d="M12 20v2"></path>
                <path d="m4.93 4.93 1.41 1.41"></path>
                <path d="m17.66 17.66 1.41 1.41"></path>
                <path d="M2 12h2"></path>
                <path d="M20 12h2"></path>
                <path d="m4.93 19.07 1.41-1.41"></path>
                <path d="m17.66 6.34 1.41-1.41"></path>
              </svg>
            </div>
            <span class="label">Daylight</span>
          </div>
          <div class="stat-main">
            <span class="value" id="daylight-duration">9h 42m</span>
            <div class="stat-deltas" aria-label="Daylight change history">
              <div class="delta-row">
                <span class="delta-label">vs. shortest day</span>
                <span class="delta-value" id="daylight-shortest-delta">+1h 06m</span>
              </div>
              <!--
              <div class="delta-row">
                <span class="delta-label">vs. 1 week ago</span>
                <span class="delta-value" id="daylight-week-delta">+15 min</span>
              </div>
              -->
              <div class="delta-row">
                <span class="delta-label">vs. 1 month ago</span>
                <span class="delta-value" id="daylight-month-delta">+1h 12m</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <button class="cta" type="button" id="share">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12v7a1 1 0 0 0 1 1h4"></path>
        <path d="M20 12v7a1 1 0 0 1-1 1h-4"></path>
        <path d="M16 8L12 4 8 8"></path>
        <path d="M12 4v13"></path>
      </svg>
      <span>Share Your Sunlight</span>
    </button>

  </div>

  <script src="astronomy-engine/astronomy.browser.min.js"></script>
  <script>
    const shareButton = document.getElementById("share");
    const headline = document.getElementById("headline");
    const lede = document.getElementById("lede");
    const cityInput = document.getElementById("city-input");
    const geolocateButton = document.getElementById("location-geolocate");
    const resultsPanel = document.getElementById("location-results");
    const resultsMeta = document.getElementById("location-results-meta");
    const resultsActions = document.getElementById("location-results-actions");
    const resultsList = document.getElementById("location-results-list");
    const clearButton = document.getElementById("location-clear");
    const milestone = document.querySelector(".milestone");
    const sunsetTimeValue = document.getElementById("sunset-time");
    const sunsetEarliestDeltaValue = document.getElementById("sunset-earliest-delta");
    const sunsetWeekDeltaValue = document.getElementById("sunset-week-delta");
    const sunsetMonthDeltaValue = document.getElementById("sunset-month-delta");
    const daylightDurationValue = document.getElementById("daylight-duration");
    const daylightShortestDeltaValue = document.getElementById("daylight-shortest-delta");
    const daylightWeekDeltaValue = document.getElementById("daylight-week-delta");
    const daylightMonthDeltaValue = document.getElementById("daylight-month-delta");
    const nextHeadline = document.getElementById("next-headline");
    const nextDate = document.getElementById("next-date");
    const nextAway = document.getElementById("next-away");
    let suggestionResults = [];
    let rawResults = [];
    let activeIndex = -1;
    let debounceId = null;
    let fetchController = null;
    let preferLocalResults = true;
    let lastQuery = "";
    let lastNameQuery = "";
    let locationBiasRequested = false;
    let locationBiasLoading = false;
    let userCoords = null;
    let lastFilterTokens = [];
    let lastFilterTokensRaw = [];
    let recentLocations = [];
    const localeSource = navigator.languages?.[0] || navigator.language || "en";
    const languageCode = localeSource.split("-")[0] || "en";
    const regionCode = (localeSource.split("-")[1] || "").toUpperCase();
    const MAX_RESULTS = 8;
    const MAX_RECENTS = 5;
    const RECENT_STORAGE_KEY = "sunshine-optimist:recent-locations";
    const CAN_USE_GEOLOCATION = "geolocation" in navigator;
    const DEFAULT_LOCATION_QUERY = "Boston";
    const DEFAULT_LOCATION = {
      name: "Boston",
      admin1: "Massachusetts",
      country: "United States",
      country_code: "US",
      latitude: 42.3601,
      longitude: -71.0589,
      elevation: 0,
      timezone: "America/New_York",
    };
    const FALLBACK_TIMEZONE =
      Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
    const getZonedParts = (date, timeZone) => {
      const formatter = new Intl.DateTimeFormat("en-US", {
        timeZone,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false,
      });
      const parts = formatter.formatToParts(date);
      const values = {};
      parts.forEach((part) => {
        if (part.type !== "literal") {
          values[part.type] = part.value;
        }
      });
      return {
        year: Number(values.year),
        month: Number(values.month),
        day: Number(values.day),
        hour: Number(values.hour),
        minute: Number(values.minute),
        second: Number(values.second),
      };
    };

    const getTimeZoneOffsetMinutes = (date, timeZone) => {
      const parts = getZonedParts(date, timeZone);
      const utcTime = Date.UTC(
        parts.year,
        parts.month - 1,
        parts.day,
        parts.hour,
        parts.minute,
        parts.second
      );
      return (utcTime - date.getTime()) / 60000;
    };

    const zonedTimeToUtc = (year, month, day, hour, minute, second, timeZone) => {
      const utcGuess = new Date(Date.UTC(year, month - 1, day, hour, minute, second));
      const offset = getTimeZoneOffsetMinutes(utcGuess, timeZone);
      let utcTime = new Date(utcGuess.getTime() - offset * 60000);
      const revisedOffset = getTimeZoneOffsetMinutes(utcTime, timeZone);
      if (revisedOffset !== offset) {
        utcTime = new Date(utcGuess.getTime() - revisedOffset * 60000);
      }
      return utcTime;
    };

    const getLocalDateParts = (date, timeZone) => {
      const { year, month, day } = getZonedParts(date, timeZone);
      return { year, month, day };
    };

    const addDaysToDateParts = (parts, deltaDays) => {
      const date = new Date(Date.UTC(parts.year, parts.month - 1, parts.day));
      date.setUTCDate(date.getUTCDate() + deltaDays);
      return {
        year: date.getUTCFullYear(),
        month: date.getUTCMonth() + 1,
        day: date.getUTCDate(),
      };
    };

    const addMonthsToDateParts = (parts, deltaMonths) => {
      const date = new Date(Date.UTC(parts.year, parts.month - 1, 1));
      date.setUTCMonth(date.getUTCMonth() + deltaMonths);
      const year = date.getUTCFullYear();
      const month = date.getUTCMonth() + 1;
      const daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();
      return {
        year,
        month,
        day: Math.min(parts.day, daysInMonth),
      };
    };

    const getDaysInYear = (year) => {
      const start = Date.UTC(year, 0, 1);
      const end = Date.UTC(year + 1, 0, 1);
      return Math.round((end - start) / 86400000);
    };

    const getMinutesSinceMidnight = (date, timeZone) => {
      const { hour, minute, second } = getZonedParts(date, timeZone);
      return hour * 60 + minute + second / 60;
    };

    const formatTime = (date, timeZone) =>
      new Intl.DateTimeFormat(localeSource, {
        timeZone,
        hour: "numeric",
        minute: "2-digit",
      }).format(date);

    const formatLongDateFromParts = (parts, timeZone) => {
      const date = zonedTimeToUtc(parts.year, parts.month, parts.day, 12, 0, 0, timeZone);
      return new Intl.DateTimeFormat(localeSource, {
        timeZone,
        month: "long",
        day: "numeric",
        year: "numeric",
      }).format(date);
    };

    const formatDuration = (minutes) => {
      const totalMinutes = Math.round(Math.abs(minutes));
      const hours = Math.floor(totalMinutes / 60);
      const mins = totalMinutes % 60;
      if (hours) {
        return `${hours}h ${mins}m`;
      }
      return `${mins}m`;
    };

    const formatDeltaMinutes = (minutes) => {
      if (minutes == null || Number.isNaN(minutes)) {
        return "—";
      }
      const rounded = Math.round(minutes);
      if (rounded === 0) {
        return "0 min";
      }
      const sign = rounded > 0 ? "+" : "-";
      const abs = Math.abs(rounded);
      const body = abs >= 60 ? formatDuration(abs) : `${abs} min`;
      return `${sign}${body}`;
    };

    const formatDaylightChangeText = (minutes) => {
      if (minutes == null || Number.isNaN(minutes)) {
        return "Sunrise or sunset isn't happening today.";
      }
      const rounded = Math.round(minutes);
      if (rounded === 0) {
        return "Same amount of daylight today";
      }
      const abs = Math.abs(rounded);
      const unit = abs === 1 ? "minute" : "minutes";
      if (rounded > 0) {
        return `+${abs} ${unit} of daylight today`;
      }
      return `${abs} ${unit} less daylight today`;
    };

    const setText = (node, value) => {
      if (!node) {
        return;
      }
      node.textContent = value;
    };

    const updateHeadlineAndLede = (deltaMinutes) => {
      if (deltaMinutes == null || Number.isNaN(deltaMinutes)) {
        headline.textContent = "Sunlight looks different here.";
        lede.textContent = "No sunrise or sunset today.";
        return;
      }
      if (deltaMinutes > 0) {
        headline.textContent = "Today is already brighter.";
      } else if (deltaMinutes < 0) {
        headline.textContent = "Today is already dimmer.";
      } else {
        headline.textContent = "Today is holding steady.";
      }
      lede.textContent = formatDaylightChangeText(deltaMinutes);
    };

    const getSunEvents = (observer, timeZone, dateParts) => {
      const startUtc = zonedTimeToUtc(
        dateParts.year,
        dateParts.month,
        dateParts.day,
        0,
        0,
        0,
        timeZone
      );
      return {
        sunrise: Astronomy.SearchRiseSet("Sun", observer, +1, startUtc, 1),
        sunset: Astronomy.SearchRiseSet("Sun", observer, -1, startUtc, 1),
      };
    };

    const getDaylightMinutes = (events) => {
      if (!events?.sunrise || !events?.sunset) {
        return null;
      }
      return (events.sunset.date - events.sunrise.date) / 60000;
    };

    const getYearlySunExtremes = (observer, timeZone, year) => {
      const yearStart = { year, month: 1, day: 1 };
      const daysInYear = getDaysInYear(year);
      let earliestSunsetMinutes = null;
      let shortestDayMinutes = null;

      for (let offset = 0; offset < daysInYear; offset += 1) {
        const dateParts = addDaysToDateParts(yearStart, offset);
        const events = getSunEvents(observer, timeZone, dateParts);

        if (events.sunset) {
          const sunsetMinutes = getMinutesSinceMidnight(events.sunset.date, timeZone);
          if (earliestSunsetMinutes == null || sunsetMinutes < earliestSunsetMinutes) {
            earliestSunsetMinutes = sunsetMinutes;
          }
        }

        const daylightMinutes = getDaylightMinutes(events);
        if (daylightMinutes != null) {
          if (shortestDayMinutes == null || daylightMinutes < shortestDayMinutes) {
            shortestDayMinutes = daylightMinutes;
          }
        }
      }

      return { earliestSunsetMinutes, shortestDayMinutes };
    };

    const getNextHalfHour = (minutes) => {
      const next = Math.floor((minutes + 30) / 30) * 30;
      return Math.min(next, 24 * 60 - 1);
    };

    const formatTimeFromMinutes = (minutes, dateParts, timeZone) => {
      const hour = Math.floor(minutes / 60);
      const minute = Math.round(minutes % 60);
      const date = zonedTimeToUtc(
        dateParts.year,
        dateParts.month,
        dateParts.day,
        hour,
        minute,
        0,
        timeZone
      );
      return formatTime(date, timeZone);
    };

    const findNextSunsetThreshold = (
      observer,
      timeZone,
      startDateParts,
      targetMinutes,
      limitDays = 370
    ) => {
      for (let offset = 1; offset <= limitDays; offset += 1) {
        const dateParts = addDaysToDateParts(startDateParts, offset);
        const { sunset } = getSunEvents(observer, timeZone, dateParts);
        if (!sunset) {
          continue;
        }
        const sunsetMinutes = getMinutesSinceMidnight(sunset.date, timeZone);
        if (sunsetMinutes >= targetMinutes) {
          return { dateParts, offsetDays: offset };
        }
      }
      return null;
    };

    const updateDaylightForLocation = (location) => {
      if (!window.Astronomy || !location) {
        return;
      }
      const timeZone = location.timezone || FALLBACK_TIMEZONE;
      const observer = new Astronomy.Observer(
        location.latitude,
        location.longitude,
        location.elevation || 0
      );
      const todayParts = getLocalDateParts(new Date(), timeZone);
      const yesterdayParts = addDaysToDateParts(todayParts, -1);
      const weekParts = addDaysToDateParts(todayParts, -7);
      const monthParts = addMonthsToDateParts(todayParts, -1);

      const todayEvents = getSunEvents(observer, timeZone, todayParts);
      const yesterdayEvents = getSunEvents(observer, timeZone, yesterdayParts);
      const weekEvents = getSunEvents(observer, timeZone, weekParts);
      const monthEvents = getSunEvents(observer, timeZone, monthParts);

      if (todayEvents.sunset) {
        sunsetTimeValue.textContent = formatTime(
          todayEvents.sunset.date,
          timeZone
        );
      } else {
        sunsetTimeValue.textContent = "—";
      }

      const todaySunsetMinutes = todayEvents.sunset
        ? getMinutesSinceMidnight(todayEvents.sunset.date, timeZone)
        : null;
      const weekSunsetMinutes = weekEvents.sunset
        ? getMinutesSinceMidnight(weekEvents.sunset.date, timeZone)
        : null;
      const monthSunsetMinutes = monthEvents.sunset
        ? getMinutesSinceMidnight(monthEvents.sunset.date, timeZone)
        : null;
      const { earliestSunsetMinutes, shortestDayMinutes } = getYearlySunExtremes(
        observer,
        timeZone,
        todayParts.year
      );

      const sunsetEarliestDelta =
        todaySunsetMinutes != null && earliestSunsetMinutes != null
          ? todaySunsetMinutes - earliestSunsetMinutes
          : null;
      const sunsetWeekDelta =
        todaySunsetMinutes != null && weekSunsetMinutes != null
          ? todaySunsetMinutes - weekSunsetMinutes
          : null;
      const sunsetMonthDelta =
        todaySunsetMinutes != null && monthSunsetMinutes != null
          ? todaySunsetMinutes - monthSunsetMinutes
          : null;

      setText(sunsetEarliestDeltaValue, formatDeltaMinutes(sunsetEarliestDelta));
      setText(sunsetWeekDeltaValue, formatDeltaMinutes(sunsetWeekDelta));
      setText(sunsetMonthDeltaValue, formatDeltaMinutes(sunsetMonthDelta));

      const todayDaylight = getDaylightMinutes(todayEvents);
      const yesterdayDaylight = getDaylightMinutes(yesterdayEvents);
      const weekDaylight = getDaylightMinutes(weekEvents);
      const monthDaylight = getDaylightMinutes(monthEvents);

      if (todayDaylight == null) {
        daylightDurationValue.textContent = "—";
      } else {
        daylightDurationValue.textContent = formatDuration(todayDaylight);
      }

      const daylightShortestDelta =
        todayDaylight != null && shortestDayMinutes != null
          ? todayDaylight - shortestDayMinutes
          : null;
      const daylightWeekDelta =
        todayDaylight != null && weekDaylight != null
          ? todayDaylight - weekDaylight
          : null;
      const daylightMonthDelta =
        todayDaylight != null && monthDaylight != null
          ? todayDaylight - monthDaylight
          : null;

      setText(daylightShortestDeltaValue, formatDeltaMinutes(daylightShortestDelta));
      setText(daylightWeekDeltaValue, formatDeltaMinutes(daylightWeekDelta));
      setText(daylightMonthDeltaValue, formatDeltaMinutes(daylightMonthDelta));

      const todayDelta =
        todayDaylight != null && yesterdayDaylight != null
          ? todayDaylight - yesterdayDaylight
          : null;
      updateHeadlineAndLede(todayDelta);

      if (todaySunsetMinutes == null) {
        nextHeadline.textContent = "Sunset timing varies here";
        nextDate.textContent = "—";
        nextAway.textContent = "";
        return;
      }

      const targetMinutes = getNextHalfHour(todaySunsetMinutes);
      const targetLabel = formatTimeFromMinutes(
        targetMinutes,
        todayParts,
        timeZone
      );
      const milestoneMatch = findNextSunsetThreshold(
        observer,
        timeZone,
        todayParts,
        targetMinutes
      );

      nextHeadline.textContent = `Next ${targetLabel} Sunset`;
      if (!milestoneMatch) {
        nextDate.textContent = "—";
        nextAway.textContent = "(Not within the next year)";
        return;
      }

      nextDate.textContent = formatLongDateFromParts(
        milestoneMatch.dateParts,
        timeZone
      );
      nextAway.textContent = `(${milestoneMatch.offsetDays} day${
        milestoneMatch.offsetDays === 1 ? "" : "s"
      } away)`;
    };

    const US_STATE_ABBR = {
      Alabama: "AL",
      Alaska: "AK",
      Arizona: "AZ",
      Arkansas: "AR",
      California: "CA",
      Colorado: "CO",
      Connecticut: "CT",
      Delaware: "DE",
      "District of Columbia": "DC",
      Florida: "FL",
      Georgia: "GA",
      Hawaii: "HI",
      Idaho: "ID",
      Illinois: "IL",
      Indiana: "IN",
      Iowa: "IA",
      Kansas: "KS",
      Kentucky: "KY",
      Louisiana: "LA",
      Maine: "ME",
      Maryland: "MD",
      Massachusetts: "MA",
      Michigan: "MI",
      Minnesota: "MN",
      Mississippi: "MS",
      Missouri: "MO",
      Montana: "MT",
      Nebraska: "NE",
      Nevada: "NV",
      "New Hampshire": "NH",
      "New Jersey": "NJ",
      "New Mexico": "NM",
      "New York": "NY",
      "North Carolina": "NC",
      "North Dakota": "ND",
      Ohio: "OH",
      Oklahoma: "OK",
      Oregon: "OR",
      Pennsylvania: "PA",
      "Rhode Island": "RI",
      "South Carolina": "SC",
      "South Dakota": "SD",
      Tennessee: "TN",
      Texas: "TX",
      Utah: "UT",
      Vermont: "VT",
      Virginia: "VA",
      Washington: "WA",
      "West Virginia": "WV",
      Wisconsin: "WI",
      Wyoming: "WY",
    };

    const US_STATE_NAME_BY_ABBR = Object.fromEntries(
      Object.entries(US_STATE_ABBR).map(([name, abbr]) => [
        abbr.toLowerCase(),
        name,
      ])
    );

    const STATE_ALIAS_BY_TOKEN = {
      dc: "District of Columbia",
    };

    const formatSelectedLocation = (item) => {
      const isUnitedStates =
        normalizeCountryCode(item) === "US" ||
        item.country?.toLowerCase() === "united states";
      const regionName = item.admin1 || "";
      const region =
        isUnitedStates && US_STATE_ABBR[regionName]
          ? US_STATE_ABBR[regionName]
          : regionName;
      const parts = isUnitedStates
        ? [item.name, region]
        : [item.name, region, item.country];
      return parts.join(", ");
    };

    const formatSuggestionLocation = (item) => {
      const isUnitedStates =
        normalizeCountryCode(item) === "US" ||
        item.country?.toLowerCase() === "united states";
      const regionName = item.admin1 || "";
      const region =
        isUnitedStates && US_STATE_ABBR[regionName]
          ? US_STATE_ABBR[regionName]
          : regionName;
      const parts = [item.name, region, item.country].filter(Boolean);
      return parts.join(", ");
    };

    const normalizeCountryCode = (item) =>
      (item.country_code || "").toUpperCase();

    const normalizeToken = (value) =>
      value.replace(/[^a-z0-9]/gi, "").toLowerCase();

    const expandFilterTokens = (tokens) => {
      const expanded = new Set();
      tokens.forEach((token) => {
        const normalized = normalizeToken(token);
        if (!normalized) {
          return;
        }
        expanded.add(normalized);
        const alias = STATE_ALIAS_BY_TOKEN[normalized];
        if (alias) {
          expanded.add(normalizeToken(alias));
        }
        const stateName = US_STATE_NAME_BY_ABBR[normalized];
        if (stateName) {
          expanded.add(normalizeToken(stateName));
        }
      });
      return [...expanded];
    };

    const formatFilterTokens = (tokens) =>
      tokens
        .map((token) => (token.length === 2 ? token.toUpperCase() : token))
        .join(" ");

    const parseQuery = (query) => {
      const parts = query.split(",");
      const name = (parts[0] || "").trim();
      const filterText = parts.slice(1).join(" ").trim();
      let tokens = filterText
        .split(/\s+/)
        .map((token) => normalizeToken(token))
        .filter(Boolean);
      let nameQuery = name || query;
      if (!tokens.length) {
        const words = name.split(/\s+/).filter(Boolean);
        const lastToken = normalizeToken(words[words.length - 1] || "");
        if (words.length > 1 && US_STATE_NAME_BY_ABBR[lastToken]) {
          tokens = [lastToken];
          nameQuery = words.slice(0, -1).join(" ");
        }
      }
      return {
        nameQuery: nameQuery || query,
        filterTokens: expandFilterTokens(tokens),
        rawFilterTokens: tokens,
      };
    };

    const normalizeNameValue = (value) => normalizeToken(value);

    const isNameMatch = (item, nameQuery) => {
      if (!nameQuery) {
        return true;
      }
      const normalizedQuery = normalizeNameValue(nameQuery);
      if (!normalizedQuery) {
        return true;
      }
      return normalizeNameValue(item.name || "").startsWith(normalizedQuery);
    };

    const matchesToken = (item, token) => {
      if (!token) {
        return true;
      }
      const fields = [item.admin1, item.admin2, item.country].filter(Boolean);
      const normalizedFields = fields.map((field) => normalizeNameValue(field));
      if (normalizedFields.some((field) => field.startsWith(token))) {
        return true;
      }
      const wordMatch = fields.some((field) =>
        field
          .toLowerCase()
          .split(/[^a-z0-9]+/)
          .some((word) => word.startsWith(token))
      );
      if (wordMatch) {
        return true;
      }
      const stateMatch = fields.some(
        (field) => US_STATE_ABBR[field] === token.toUpperCase()
      );
      if (stateMatch) {
        return true;
      }
      const countryCode = (item.country_code || "").toLowerCase();
      return countryCode ? countryCode.startsWith(token) : false;
    };

    const applyFilterTokens = (items, tokens) => {
      if (!tokens.length) {
        return items;
      }
      return items.filter((item) =>
        tokens.every((token) => matchesToken(item, token))
      );
    };

    const updateClearButton = () => {
      const hasValue = cityInput.value.trim().length > 0;
      clearButton.classList.toggle("is-visible", hasValue);
    };

    const updateGeolocateButton = () => {
      if (!geolocateButton) {
        return;
      }
      if (!CAN_USE_GEOLOCATION) {
        geolocateButton.disabled = true;
        geolocateButton.title = "Location unavailable";
        return;
      }
      geolocateButton.disabled = locationBiasLoading;
      geolocateButton.title = locationBiasLoading ? "Locating..." : "Use my location";
    };

    const loadRecentLocations = () => {
      try {
        const stored = localStorage.getItem(RECENT_STORAGE_KEY);
        const parsed = stored ? JSON.parse(stored) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        console.warn("Unable to load recent locations:", error);
        return [];
      }
    };

    const saveRecentLocations = (items) => {
      try {
        localStorage.setItem(RECENT_STORAGE_KEY, JSON.stringify(items));
      } catch (error) {
        console.warn("Unable to save recent locations:", error);
      }
    };

    const updateRecentLocations = (item) => {
      const updated = [
        item,
        ...recentLocations.filter(
          (entry) =>
            entry.name !== item.name ||
            entry.admin1 !== item.admin1 ||
            entry.country_code !== item.country_code
        ),
      ].slice(0, MAX_RECENTS);
      recentLocations = updated;
      saveRecentLocations(updated);
    };

    const showRecentResults = () => {
      if (!recentLocations.length) {
        clearResults();
        return;
      }
      const statusMessages = [
        { text: "Recent locations.", type: "hint" },
      ];
      const groups = [
        {
          label: "Recent",
          items: recentLocations,
        },
      ];
      renderResults(groups, {
        statusMessages,
        actions: getActionItems(),
        emptyMessage: "No recent locations yet.",
      });
    };

    const setStatusMessages = (messages) => {
      resultsMeta.innerHTML = "";
      messages.forEach((message) => {
        const status = document.createElement("div");
        status.className = `location-status${
          message.type ? ` is-${message.type}` : ""
        }`;
        status.textContent = message.text;
        resultsMeta.appendChild(status);
      });
      if (resultsPanel.classList.contains("is-open")) {
        updateResultsMaxHeight();
      }
    };

    const renderActions = (actions) => {
      resultsActions.innerHTML = "";
      actions.forEach((action) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `location-action${
          action.variant ? ` ${action.variant}` : ""
        }`;
        button.dataset.action = action.action;
        button.textContent = action.label;
        if (action.disabled) {
          button.disabled = true;
        }
        resultsActions.appendChild(button);
      });
      if (resultsPanel.classList.contains("is-open")) {
        updateResultsMaxHeight();
      }
    };

    const openResultsPanel = () => {
      resultsPanel.classList.add("is-open");
      cityInput.setAttribute("aria-expanded", "true");
      updateResultsMaxHeight();
    };

    const getActionItems = ({ toggleLabel, includeRetry } = {}) => {
      const actions = [];
      if (toggleLabel) {
        actions.push({
          action: "toggle-preference",
          label: toggleLabel,
        });
      }
      if (includeRetry) {
        actions.push({
          action: "retry",
          label: "Retry search",
          variant: "is-secondary",
        });
      }
      return actions;
    };

    const groupResults = (results, nameQuery) => {
      const exactMatches = [];
      const nearbyMatches = [];
      results.forEach((item) => {
        if (isNameMatch(item, nameQuery)) {
          exactMatches.push(item);
        } else {
          nearbyMatches.push(item);
        }
      });
      const groups = [];
      if (exactMatches.length) {
        groups.push({
          label: nearbyMatches.length ? "Matches" : null,
          items: exactMatches,
        });
      }
      if (nearbyMatches.length) {
        groups.push({
          label: exactMatches.length ? "Nearby" : null,
          items: nearbyMatches,
        });
      }
      return groups;
    };

    const renderGroup = (group) => {
      const wrapper = document.createElement("div");
      wrapper.className = "location-group";
      wrapper.role = group.label ? "group" : "presentation";
      if (group.label) {
        wrapper.setAttribute("aria-label", group.label);
        const label = document.createElement("div");
        label.className = "location-group-label";
        label.textContent = group.label;
        label.setAttribute("aria-hidden", "true");
        wrapper.appendChild(label);
      }
      group.items.forEach((item) => {
        const index = suggestionResults.length;
        suggestionResults.push(item);
        const option = document.createElement("div");
        option.id = `location-option-${index}`;
        option.className = "location-option";
        option.role = "option";
        option.tabIndex = -1;
        option.dataset.index = String(index);
        option.textContent = formatSuggestionLocation(item);
        wrapper.appendChild(option);
      });
      resultsList.appendChild(wrapper);
    };

    const showLoadingState = () => {
      suggestionResults = [];
      activeIndex = -1;
      resultsList.innerHTML = "";
      cityInput.removeAttribute("aria-activedescendant");
      setStatusMessages([{ text: "Searching for cities...", type: "hint" }]);
      renderActions(getActionItems());
      openResultsPanel();
    };

    const showErrorState = () => {
      suggestionResults = [];
      activeIndex = -1;
      resultsList.innerHTML = "";
      cityInput.removeAttribute("aria-activedescendant");
      setStatusMessages([
        {
          text: "Could not fetch city suggestions. Check your connection and try again.",
          type: "error",
        },
      ]);
      renderActions(getActionItems({ includeRetry: true }));
      openResultsPanel();
    };

    const requestLocationBias = () => {
      if (locationBiasRequested || !("geolocation" in navigator)) {
        return;
      }
      locationBiasRequested = true;
      locationBiasLoading = true;
      updateGeolocateButton();
      renderActions(getActionItems());
      navigator.geolocation.getCurrentPosition(
        (position) => {
          userCoords = {
            lat: position.coords.latitude,
            lon: position.coords.longitude,
          };
          locationBiasLoading = false;
          updateGeolocateButton();
          if (rawResults.length) {
            buildResults(rawResults, lastFilterTokens, lastFilterTokensRaw);
          } else {
            renderActions(getActionItems());
          }
        },
        () => {
          locationBiasLoading = false;
          locationBiasRequested = false;
          updateGeolocateButton();
          renderActions(getActionItems());
        },
        { enableHighAccuracy: false, timeout: 5000 }
      );
    };

    recentLocations = loadRecentLocations();

    const distanceKm = (lat1, lon1, lat2, lon2) => {
      const toRad = (value) => (value * Math.PI) / 180;
      const earthRadius = 6371;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) *
          Math.cos(toRad(lat2)) *
          Math.sin(dLon / 2) ** 2;
      return 2 * earthRadius * Math.asin(Math.sqrt(a));
    };

    const sortByDistance = (items) => {
      if (!userCoords) {
        return items;
      }
      return [...items].sort((a, b) => {
        const distanceA = distanceKm(
          userCoords.lat,
          userCoords.lon,
          a.latitude,
          a.longitude
        );
        const distanceB = distanceKm(
          userCoords.lat,
          userCoords.lon,
          b.latitude,
          b.longitude
        );
        return distanceA - distanceB;
      });
    };

    const clearResults = () => {
      resultsList.innerHTML = "";
      resultsMeta.innerHTML = "";
      resultsActions.innerHTML = "";
      resultsPanel.classList.remove("is-open");
      cityInput.setAttribute("aria-expanded", "false");
      cityInput.removeAttribute("aria-activedescendant");
      resultsList.style.maxHeight = "";
      suggestionResults = [];
      rawResults = [];
      activeIndex = -1;
    };

    const updateResultsMaxHeight = () => {
      if (!resultsPanel.classList.contains("is-open")) {
        return;
      }
      const locationRect = cityInput.getBoundingClientRect();
      const milestoneRect = milestone?.getBoundingClientRect();
      const spacing = 12;
      const available =
        milestoneRect && milestoneRect.top > locationRect.bottom + spacing
          ? milestoneRect.top - locationRect.bottom - spacing
          : window.innerHeight - locationRect.bottom - spacing;
      const chromeHeight = resultsMeta.offsetHeight + resultsActions.offsetHeight + 24;
      const maxHeight = Math.max(0, Math.min(260, available - chromeHeight));
      resultsList.style.maxHeight = `${maxHeight}px`;
    };

    const renderResults = (groups, options = {}) => {
      resultsList.innerHTML = "";
      suggestionResults = [];
      activeIndex = -1;

      const statusMessages = [...(options.statusMessages || [])];
      const hasItems = groups.some((group) => group.items.length);
      if (!hasItems && options.emptyMessage) {
        statusMessages.push({ text: options.emptyMessage, type: "hint" });
      }
      setStatusMessages(statusMessages);
      renderActions(options.actions || []);

      if (hasItems) {
        groups.forEach(renderGroup);
      }

      openResultsPanel();

      if (hasItems) {
        updateActiveOption(0);
      } else {
        cityInput.removeAttribute("aria-activedescendant");
      }
    };

    const buildResults = (
      results,
      filterTokens = lastFilterTokens,
      rawTokens = lastFilterTokensRaw
    ) => {
      rawResults = results;
      const filteredResults = applyFilterTokens(results, filterTokens);
      const effectiveResults = filteredResults.length
        ? filteredResults
        : results;
      const localResults = regionCode
        ? effectiveResults.filter(
            (item) => normalizeCountryCode(item) === regionCode
          )
        : [];
      const otherResults = regionCode
        ? effectiveResults.filter(
            (item) => normalizeCountryCode(item) !== regionCode
          )
        : effectiveResults;
      const sortedLocal = sortByDistance(localResults);
      const sortedAll = sortByDistance(effectiveResults);
      const filterHint =
        rawTokens.length && !filteredResults.length
          ? `No matches for "${formatFilterTokens(
              rawTokens
            )}". Showing broader results.`
          : null;
      const localityLabel = userCoords ? "nearby" : "local";
      const localityLabelTitle = userCoords ? "Nearby" : "Local";

      let displayResults = sortedAll;
      let toggleLabel = null;
      const statusMessages = [];

      if (preferLocalResults && sortedLocal.length) {
        displayResults = sortedLocal;
        toggleLabel = otherResults.length ? "Show worldwide results" : null;
      } else if (preferLocalResults && !sortedLocal.length && regionCode) {
        displayResults = sortedAll;
        statusMessages.push({
          text: `No ${localityLabel} matches. Showing worldwide results.`,
          type: "hint",
        });
      } else {
        displayResults = sortedAll;
        if (sortedLocal.length && otherResults.length) {
          toggleLabel = userCoords ? "Prefer nearby results" : "Prefer local results";
          statusMessages.push({
            text: "Showing worldwide results.",
            type: "hint",
          });
        }
      }

      if (filterHint) {
        statusMessages.unshift({ text: filterHint, type: "hint" });
      }

      const groups = groupResults(
        displayResults.slice(0, MAX_RESULTS),
        lastNameQuery
      );
      renderResults(groups, {
        statusMessages,
        actions: getActionItems({ toggleLabel }),
        emptyMessage: "No matches yet.",
      });
    };

    const selectResult = (item) => {
      const label = formatSelectedLocation(item);
      cityInput.value = label;
      updateRecentLocations(item);
      updateClearButton();
      clearResults();
      updateDaylightForLocation(item);
      console.log(`Selected city: ${label}`, {
        latitude: item.latitude,
        longitude: item.longitude,
      });
    };

    const updateActiveOption = (nextIndex) => {
      const options = resultsList.querySelectorAll(".location-option");
      if (!options.length) {
        activeIndex = -1;
        cityInput.removeAttribute("aria-activedescendant");
        return;
      }
      activeIndex = Math.max(0, Math.min(nextIndex, options.length - 1));
      options.forEach((option, index) => {
        const isActive = index === activeIndex;
        option.classList.toggle("is-active", isActive);
        option.setAttribute("aria-selected", isActive ? "true" : "false");
        option.tabIndex = isActive ? 0 : -1;
        if (isActive) {
          cityInput.setAttribute("aria-activedescendant", option.id);
          option.scrollIntoView({ block: "nearest" });
        }
      });
    };

    const fetchSuggestions = async (nameQuery, filterTokens, rawTokens) => {
      if (fetchController) {
        fetchController.abort();
      }
      fetchController = new AbortController();
      showLoadingState();
      const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(
        nameQuery
      )}&count=20&language=${encodeURIComponent(
        languageCode
      )}&format=json`;
      try {
        const response = await fetch(url, { signal: fetchController.signal });
        if (!response.ok) {
          throw new Error("Failed to fetch city suggestions.");
        }
        const data = await response.json();
        const results = (data.results || []).map((item) => ({
          name: item.name,
          admin1: item.admin1,
          admin2: item.admin2,
          country: item.country,
          country_code: item.country_code,
          latitude: item.latitude,
          longitude: item.longitude,
          elevation: item.elevation,
          timezone: item.timezone,
        }));
        buildResults(results, filterTokens, rawTokens);
      } catch (error) {
        if (error.name === "AbortError") {
          return;
        }
        console.error("City lookup failed:", error);
        showErrorState();
      }
    };

    const fetchDefaultLocation = async () => {
      const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(
        DEFAULT_LOCATION_QUERY
      )}&count=10&language=${encodeURIComponent(
        languageCode
      )}&format=json`;
      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error("Failed to fetch default location.");
        }
        const data = await response.json();
        const results = (data.results || []).map((item) => ({
          name: item.name,
          admin1: item.admin1,
          admin2: item.admin2,
          country: item.country,
          country_code: item.country_code,
          latitude: item.latitude,
          longitude: item.longitude,
          elevation: item.elevation,
          timezone: item.timezone,
        }));
        const match =
          results.find(
            (item) =>
              (item.name || "").toLowerCase() === "boston" &&
              normalizeCountryCode(item) === "US" &&
              (item.admin1 || "").toLowerCase() === "massachusetts"
          ) ||
          results.find(
            (item) =>
              (item.name || "").toLowerCase() === "boston" &&
              normalizeCountryCode(item) === "US"
          ) ||
          results[0];
        if (match) {
          selectResult(match);
          return;
        }
        selectResult(DEFAULT_LOCATION);
      } catch (error) {
        console.warn("Default location lookup failed:", error);
        selectResult(DEFAULT_LOCATION);
      }
    };

    const handleInput = () => {
      const query = cityInput.value.trim();
      lastQuery = query;
      const { nameQuery, filterTokens, rawFilterTokens } = parseQuery(query);
      lastNameQuery = nameQuery;
      lastFilterTokens = filterTokens;
      lastFilterTokensRaw = rawFilterTokens;
      updateClearButton();
      if (nameQuery.length < 2) {
        if (debounceId) {
          clearTimeout(debounceId);
          debounceId = null;
        }
        if (fetchController) {
          fetchController.abort();
          fetchController = null;
        }
        if (recentLocations.length) {
          showRecentResults();
        } else {
          clearResults();
        }
        return;
      }
      if (debounceId) {
        clearTimeout(debounceId);
      }
      debounceId = window.setTimeout(() => {
        fetchSuggestions(nameQuery, filterTokens, rawFilterTokens);
      }, 250);
    };

    cityInput.addEventListener("input", handleInput);
    cityInput.addEventListener("focus", () => {
      handleInput();
    });
    clearButton.addEventListener("click", () => {
      cityInput.value = "";
      lastQuery = "";
      lastNameQuery = "";
      lastFilterTokens = [];
      lastFilterTokensRaw = [];
      updateClearButton();
      if (recentLocations.length) {
        showRecentResults();
      } else {
        clearResults();
      }
      cityInput.focus();
    });
    if (geolocateButton) {
      geolocateButton.addEventListener("click", () => {
        requestLocationBias();
        cityInput.focus();
      });
    }
    cityInput.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        clearResults();
        return;
      }
      if (!suggestionResults.length) {
        return;
      }
      if (event.key === "ArrowDown") {
        event.preventDefault();
        updateActiveOption(activeIndex + 1);
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        updateActiveOption(activeIndex - 1);
      } else if (event.key === "Home") {
        event.preventDefault();
        updateActiveOption(0);
      } else if (event.key === "End") {
        event.preventDefault();
        updateActiveOption(suggestionResults.length - 1);
      } else if (event.key === "Enter") {
        if (activeIndex >= 0) {
          event.preventDefault();
          selectResult(suggestionResults[activeIndex]);
        } else if (suggestionResults.length) {
          event.preventDefault();
          selectResult(suggestionResults[0]);
        }
      }
    });

    resultsList.addEventListener("click", (event) => {
      const target = event.target.closest(".location-option");
      if (!target) {
        return;
      }
      const index = Number(target.dataset.index);
      const item = suggestionResults[index];
      if (item) {
        selectResult(item);
      }
    });

    resultsList.addEventListener("keydown", (event) => {
      const target = event.target.closest(".location-option");
      if (!target) {
        return;
      }
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        const index = Number(target.dataset.index);
        const item = suggestionResults[index];
        if (item) {
          selectResult(item);
        }
      } else if (event.key === "ArrowDown") {
        event.preventDefault();
        updateActiveOption(activeIndex + 1);
        const options = resultsList.querySelectorAll(".location-option");
        options[activeIndex]?.focus();
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        updateActiveOption(activeIndex - 1);
        const options = resultsList.querySelectorAll(".location-option");
        options[activeIndex]?.focus();
      } else if (event.key === "Escape") {
        clearResults();
        cityInput.focus();
      }
    });

    resultsActions.addEventListener("click", (event) => {
      const action = event.target.closest("[data-action]");
      if (!action) {
        return;
      }
      const actionType = action.dataset.action;
      if (actionType === "toggle-preference") {
        preferLocalResults = !preferLocalResults;
        if (rawResults.length) {
          buildResults(rawResults, lastFilterTokens, lastFilterTokensRaw);
        }
      } else if (actionType === "geolocate") {
        requestLocationBias();
      } else if (actionType === "retry") {
        if (lastNameQuery.length >= 2) {
          fetchSuggestions(lastNameQuery, lastFilterTokens, lastFilterTokensRaw);
        } else {
          clearResults();
        }
      }
    });

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".location")) {
        clearResults();
      }
    });

    document.addEventListener("focusin", (event) => {
      if (!event.target.closest(".location")) {
        clearResults();
      }
    });

    window.addEventListener("resize", updateResultsMaxHeight);

    updateGeolocateButton();
    fetchDefaultLocation();

    shareButton.addEventListener("click", () => {
      const message = `${headline.textContent} ${lede.textContent} — via Sunshine Optimist`;
      navigator.clipboard?.writeText(message).then(() => {
        const label = shareButton.querySelector("span");
        const previous = label.textContent;
        label.textContent = "Copied!";
        setTimeout(() => (label.textContent = previous), 1200);
      });
    });
  </script>
</body>
</html>
