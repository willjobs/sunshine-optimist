<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunshine Optimist</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Manrope:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div class="shell">
    <header class="masthead">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 23h24" />
            <path d="M8 23a8 8 0 0 1 16 0" />
            <path d="M16 4v4" />
            <path d="M6.5 8.5l2.8 2.8" />
            <path d="M25.5 8.5l-2.8 2.8" />
          </svg>
        </div>
        <span class="brand-title">Sunshine Optimist</span>
      </div>
      <div class="controls">
        <div class="location" aria-label="Location">
          <button
            class="location-geolocate"
            id="location-geolocate"
            type="button"
            aria-label="Use my location"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 21s-6-5.33-6-10a6 6 0 0 1 12 0c0 4.67-6 10-6 10z"></path>
              <circle cx="12" cy="11" r="2.5"></circle>
            </svg>
          </button>
          <div class="location-input">
            <label class="sr-only" for="city-input">City</label>
            <input
              id="city-input"
              type="text"
              role="combobox"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="location-results-list"
              autocomplete="off"
              placeholder="Enter your city"
            />
            <button
              class="location-clear"
              id="location-clear"
              type="button"
              aria-label="Clear location"
            >
              Clear
            </button>
            <div class="location-results" id="location-results" aria-label="City suggestions">
              <div
                class="location-results-meta"
                id="location-results-meta"
                role="status"
                aria-live="polite"
              ></div>
              <div
                class="location-results-list"
                id="location-results-list"
                role="listbox"
                aria-label="City suggestions"
              ></div>
              <div class="location-results-actions" id="location-results-actions"></div>
            </div>
          </div>
        </div>

        <div class="date-picker" aria-label="Date">
          <label class="sr-only" for="date-input">Date</label>
          <input class="date-input" id="date-input" type="date" />
          <button class="date-reset" id="date-reset" type="button">Today</button>
        </div>
      </div>
    </header>

    <section class="card" aria-live="polite">
      <h1 id="headline"></h1>
      <p class="lede" id="lede"></p>
      <div class="milestone" aria-label="Upcoming milestone">
        <div class="milestone-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="5" width="16" height="15" rx="2" />
            <path d="M16 3v4" />
            <path d="M8 3v4" />
            <path d="M4 11h16" />
            <path d="M9 15h6" />
          </svg>
        </div>
        <div class="milestone-copy">
          <p class="milestone-eyebrow">Coming up</p>
          <p class="milestone-headline" id="next-headline"></p>
          <p class="milestone-date">
            <span class="milestone-date-text" id="next-date"></span>
            <span class="milestone-away" id="next-away"></span>
          </p>
        </div>
        <button class="milestone-toggle" id="milestone-toggle" type="button" aria-label="Next milestone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14" />
            <path d="m13 6 6 6-6 6" />
          </svg>
        </button>
      </div>

      <div class="stat-row">
        <div class="stat">
          <div class="stat-header">
            <div class="stat-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 10V2"></path>
                <path d="m4.93 10.93 1.41 1.41"></path>
                <path d="M2 18h2"></path>
                <path d="M20 18h2"></path>
                <path d="m19.07 10.93-1.41 1.41"></path>
                <path d="M22 22H2"></path>
                <path d="m16 6-4 4-4-4"></path>
                <path d="M16 18a4 4 0 0 0-8 0"></path>
              </svg>
            </div>
            <span class="label">Sunset</span>
          </div>
          <div class="stat-main">
            <span class="value" id="sunset-time"></span>
            <div class="stat-deltas" aria-label="Sunset change history">
              <div class="delta-line" id="sunset-earliest-row">
                <span class="delta-emphasis" id="sunset-earliest-delta"></span>
                <span class="delta-text">
                  than the
                  <span class="delta-reference" id="sunset-earliest-reference">
                    earliest sunset
                  </span>
                </span>
              </div>
              <div class="delta-line" id="sunset-month-row">
                <span class="delta-emphasis" id="sunset-month-delta"></span>
                <span class="delta-text">
                  than
                  <span class="delta-reference" id="sunset-comparison-reference">
                    1 month ago
                  </span>
                </span>
              </div>
            </div>
          </div>
        </div>
        <div class="stat">
          <div class="stat-header">
            <div class="stat-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2"></path>
                <path d="M12 20v2"></path>
                <path d="m4.93 4.93 1.41 1.41"></path>
                <path d="m17.66 17.66 1.41 1.41"></path>
                <path d="M2 12h2"></path>
                <path d="M20 12h2"></path>
                <path d="m4.93 19.07 1.41-1.41"></path>
                <path d="m17.66 6.34 1.41-1.41"></path>
              </svg>
            </div>
            <span class="label">Daylight</span>
          </div>
          <div class="stat-main">
            <span class="value" id="daylight-duration"></span>
            <div class="stat-deltas" aria-label="Daylight change history">
              <div class="delta-line" id="daylight-shortest-row">
                <span class="delta-emphasis" id="daylight-shortest-delta"></span>
                <span class="delta-text">
                  than the
                  <span class="delta-reference" id="daylight-shortest-reference">
                    shortest day
                  </span>
                </span>
              </div>
              <div class="delta-line" id="daylight-month-row">
                <span class="delta-emphasis" id="daylight-month-delta"></span>
                <span class="delta-text">
                  than
                  <span class="delta-reference" id="daylight-comparison-reference">
                    1 month ago
                  </span>
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="share">
      <button class="cta" type="button" id="share">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 12v7a1 1 0 0 0 1 1h4"></path>
          <path d="M20 12v7a1 1 0 0 1-1 1h-4"></path>
          <path d="M16 8L12 4 8 8"></path>
          <path d="M12 4v13"></path>
        </svg>
        <span>Share Your Sunlight</span>
      </button>
    </div>

    <dialog class="share-modal" id="share-modal" aria-labelledby="share-modal-title">
      <div class="share-modal-content">
        <div class="share-modal-header">
          <h2 id="share-modal-title">Share your daylight</h2>
          <button class="share-modal-close" type="button" id="share-modal-close" aria-label="Close share dialog">
            Close
          </button>
        </div>
        <div class="share-modal-body">
          <label class="share-privacy">
            <input type="checkbox" id="share-privacy-toggle" />
            <span>Share as "My Location"</span>
          </label>
          <div class="share-preview" aria-live="polite">
            <pre id="share-preview"></pre>
          </div>
        </div>
        <div class="share-actions" aria-label="Share options">
          <button class="share-copy-button" type="button" data-share="copy">
            Copy to clipboard
          </button>
          <div class="share-actions-group">
            <span class="share-actions-label">Share to:</span>
            <div class="share-actions-buttons">
              <button class="share-icon-button" type="button" data-share="instagram" aria-label="Share to Instagram" title="Share to Instagram">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                  <circle cx="12" cy="12" r="4"></circle>
                  <circle cx="17.5" cy="6.5" r="1"></circle>
                </svg>
              </button>
              <button class="share-icon-button" type="button" data-share="facebook" aria-label="Share to Facebook" title="Share to Facebook">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
                </svg>
              </button>
              <button class="share-icon-button" type="button" data-share="x" aria-label="Share to X" title="Share to X">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M18.244 2H21l-6.63 7.577L22 22h-6.828l-5.35-6.935L3.84 22H1l7.11-8.124L2 2h6.828l4.84 6.245L18.244 2z"></path>
                </svg>
              </button>
              <button class="share-icon-button" type="button" data-share="bluesky" aria-label="Share to Bluesky" title="Share to Bluesky">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M12 11c-2.3-3.2-5.6-5.2-9-5.2 0 3.6 1.7 6.5 5.1 7.7C6.6 14.7 5 17.5 5 21c3 0 6.2-2 7-5.4 0.8 3.4 4 5.4 7 5.4 0-3.5-1.6-6.3-3.1-7.5 3.4-1.2 5.1-4.1 5.1-7.7-3.4 0-6.7 2-9 5.2z"></path>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </dialog>

  </div>

  <script src="astronomy-engine/astronomy.browser.min.js"></script>
  <script type="module" src="scripts/app.js"></script>
</body>
</html>
